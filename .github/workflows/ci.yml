name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test C++17
        run: make all test CXX=${{ matrix.compiler }} CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Test input pacing
        if: matrix.compiler == 'g++'
        run: make test-js
      - name: Check memory and undefined behavior
        run: |
          ${{ matrix.compiler }} -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/game_tests.cpp -o build/sanitized-tests
          ./build/sanitized-tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Emscripten 4.0.15
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
      - name: Compile the browser engine
        run: make web EMXX="$RUNNER_TEMP/emsdk/upstream/emscripten/em++"
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise the real browser game
        run: make test-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crystal-cavern-web
          path: web/
