name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and test C++17
        run: make all test CXX=${{ matrix.compiler }} CXXFLAGS='-std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Test input pacing
        if: matrix.compiler == 'g++'
        run: make test-js
      - name: Check memory and undefined behavior
        run: |
          ${{ matrix.compiler }} -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/game_tests.cpp -o build/sanitized-tests
          ./build/sanitized-tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Emscripten 4.0.15
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
      - name: Compile the browser engine
        run: make web EMXX="$RUNNER_TEMP/emsdk/upstream/emscripten/em++"
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Exercise the real browser game
        run: make test-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crystal-cavern-web
          path: web/
